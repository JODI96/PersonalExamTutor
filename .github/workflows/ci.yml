name: Build Documentation

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    name: Compile Typst document
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Verify Typst version
        run: typst --version

      - name: Compile summary document
        run: |
          mkdir -p output
          typst compile docs/summary.typ output/summary.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-pdf
          path: output/summary.pdf
          retention-days: 30
